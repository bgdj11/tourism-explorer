<div class="lights-out-container">
    <h2>Lights Out</h2>
    <div class="grid">
      <div
        class="cell"
        *ngFor="let row of grid; let i = index"
        [style.--row]="i"
      >
        <button
          *ngFor="let cell of row; let j = index"
          [class.on]="cell"
          [class.off]="!cell"
          (click)="toggle(i, j)"
        >
        </button>
      </div>
    </div>
    <button (click)="restartGame()">Restart</button>
</div>
