<div class="container">
    <h2 class="title">Published Tours</h2>
  
    <!-- Loading message -->
    <div *ngIf="!problems.length" class="loading-message">
      <p>Loading published tours...</p>
    </div>
  
    <!-- List of published tours -->
    <div *ngIf="problems.length > 0" class="tours-list">
      <ul>
        <li *ngFor="let tour of problems" class="tour-item">
          <h3 class="tour-title">{{ tour.name }}</h3>
          <p class="tour-description">{{ tour.description }}</p>
          <p class="tour-weight">Weight: {{ tour.weight }}</p>
          <p class="tour-price" *ngIf="tour.price">Price: ${{ tour.price }}</p>
  
          <!-- Add to cart button -->
          <button (click)="addTourToCart(tour)" class="add-to-cart-btn">Add to Cart</button>
        </li>
      </ul>
    </div>
  
    <!-- No published tours message -->
    <div *ngIf="problems.length === 0" class="no-tours-message">
      <p>No published tours available at the moment.</p>
    </div>
  </div>
