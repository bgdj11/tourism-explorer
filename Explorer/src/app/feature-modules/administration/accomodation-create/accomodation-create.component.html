<div class="accomodation-page">
  <h1 class="page-title">Available Accomodations</h1>
  <div class="accomodation-container" *ngIf="accomodations.length > 0;">
    <div *ngFor="let accomodation of accomodations; let i = index" class="accomodation-card">
      <h2 class="accomodation-name">{{ accomodation.name }}</h2>
      <p class="accomodation-description">{{ accomodation.description }}</p>
      <p><strong>Location:</strong> {{ accomodation.city }}</p>
      <p><strong>Contact:</strong> {{ accomodation.contactNumber }}</p>
      <div class="image-container">
        <button (click)="showPrevImage(i)" class="arrow-btn">&#8592;</button>
      <img
        *ngIf="accomodation.images.length > 0"
        [src]="accomodation.images[currentImageIndexes[i]]"
        alt="{{ accomodation.name }}"
        class="accImg"
      />
      <button (click)="showNextImage(i)" class="arrow-btn">&#8594;</button>
    </div>
      </div>
  </div>
    <!-- Forma za kreiranje ili uređivanje Encounter-a -->
    <div class="form-container">
      <h2>Create New Accomodation</h2>
      <form [formGroup]="accomodationForm" (ngSubmit)="onSubmit()" class="form">
  
        <!-- Name Field -->
        <mat-form-field class="full-width">
          <mat-label>Name</mat-label>
          <input matInput formControlName="name" placeholder="Enter accomodation name" />
        </mat-form-field>
  
        <!-- Description Field -->
        <mat-form-field class="full-width">
          <mat-label>Description</mat-label>
          <textarea matInput formControlName="description" placeholder="Enter accomodation description"></textarea>
        </mat-form-field>
  
        <!-- Location Field -->
        
            <mat-form-field class="full-width">
                <mat-label>Latitude</mat-label>
                <input type="number" matInput formControlName="latitude" placeholder="Enter latitude" />
            </mat-form-field>
  
          <mat-form-field class="full-width">
            <mat-label>Longitude</mat-label>
            <input matInput type="number" formControlName="longitude" placeholder="Enter longitude" />
          </mat-form-field>
       
  
  
        <mat-form-field class="full-width">
            <mat-label>City</mat-label>
            <input matInput formControlName="city" placeholder="Enter city name" />
        </mat-form-field>  
        
        <mat-form-field class="full-width">
            <mat-label>Contact Number</mat-label>
            <input matInput formControlName="contactNumber" placeholder="Enter contact number" />
        </mat-form-field>
        
  
        <!-- Type Field -->
        <mat-form-field class="full-width">
        <mat-label>Type</mat-label>
        <mat-select formControlName="category">
          <mat-option *ngFor="let category of categories" [value]="category.value">
            {{ category.label }}
          </mat-option>
        </mat-select>
        </mat-form-field>
  
        <div>
          <div class="form-group">
            <label for="image">Image</label>
            <input
              type="file"
              class="form-control"
              id="image"
              multiple
              #fileInput
              (change)="onImageSelected($event)"
            />
          </div>
          <div class="image-preview" *ngFor="let image of images.controls; let i = index">
                <img [src]="image.value" alt="Selected Image" style="max-width: 150px; margin: 5px;" />
                <button type="button" (click)="removeImage(i, fileInput)">Remove</button>
            </div>
        </div>
  
        
  
  
        <!-- Submit and Cancel Buttons -->
        <div class="form-actions">
          <button mat-raised-button color="primary" type="submit">
            Create Accomodation
          </button>
          <button mat-button color="warn" type="button" (click)="resetForm()">Cancel</button>
        </div>
      </form>
    </div>
    
</div>
<div>
    <xp-map [isAccomodationContext]="isAccomodationContext" #mapa class="mapa" (locationSelected)="onLocationSelected($event)" ></xp-map>
  </div>
