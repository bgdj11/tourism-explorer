<div *ngIf="loading" class="loading-spinner">
    Loading bundles...
  </div>
  
  <div *ngIf="!loading && errorMessage" class="error-message">
    {{ errorMessage }}
  </div>
  
  <div *ngIf="!loading && !errorMessage">
    <h1>Purchased Bundles</h1>
    <div *ngFor="let bundle of bundles" class="bundle-card">
      <h2>{{ bundle.name }}</h2>
      <p>Custom Price: {{ bundle.customPrice | currency }}</p>
      <p>Total Tours Price: {{ bundle.totalToursPrice | currency }}</p>
      <p>Status: {{ bundle.status }}</p>
      <h3>Tours</h3>
      <ul>
        <li *ngFor="let tour of bundle.tours">
          {{ tour.name }} - {{ tour.price | currency }}
        </li>
      </ul>
    </div>
  </div>
