<div *ngIf="bundles.length > 0; else noBundles">
    <h2>Published Bundles</h2>
    <ul>
      <li *ngFor="let bundle of bundles">
        <h3>{{ bundle.name }}</h3>
        <p>Price: {{ bundle.customPrice | currency }}</p>
        <p>Published Date: {{ bundle.publishedDate | date }}</p>
        <div>
          <h4>Tours:</h4>
          <ul>
            <li *ngFor="let tour of bundle.tours">
              {{ tour.name }} - {{ tour.price | currency }}
            </li>
          </ul>
        </div>
        <!-- Ispravljeno da koristi addTourToCart -->
        <button (click)="addBundleToCart(bundle)">Add to Cart</button>

      </li>
    </ul>
  </div>
  
  <ng-template #noBundles>
    <p>No published bundles available.</p>
  </ng-template>
  <div class="shopping-cart-button">
    <button routerLink="/shopping-cart" class="cart-button" color="primary" >
        <mat-icon>shopping_cart</mat-icon>
    </button>
  </div>
