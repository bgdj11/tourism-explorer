<mat-toolbar class="navbar">
    <div class="navbar-left">
       <img src="../../../../assets/bck.jpg" alt="logo" class="logo" />
       <button mat-button class="custom-button" routerLink="/home">{{ 'NAVBAR.HOME' | translate }}</button>
       <button *ngIf="user && (user.role === 'author' || user.role === 'tourist')" (click)="getNotifications()" mat-icon-button>
        <mat-icon>notifications</mat-icon><span *ngIf="notificationsNum > 0" class="notification-badge">{{ notificationsNum }}</span></button>

      <button mat-button class="custom-button" (click)="changeLanguage('en')">English</button>
      <button mat-button class="custom-button" (click)="changeLanguage('sr')">Српски</button>
    </div>
    <div class="notification-dropdown" *ngIf="isNotificationDropdownOpen">
        <ul>
            <div style="font-size: small; margin-left: 5px;" *ngIf="notifications.length === 0">
                No new notifications
            </div>
          <li *ngFor="let notification of notifications">
            <div [routerLink]="[notification.message.resourceUrl]">
                {{ notification.message.content || 'No message available' }}
            </div>
          </li>
        </ul>
      </div>
    <div class="navbar-right">
        <button *ngIf="user && user.username === ''" mat-button class="custom-button" [routerLink]="['login']">{{ 'NAVBAR.LOGIN' | translate }}</button>
        <button *ngIf="user && user.username !== ''" mat-button class="custom-button" (click)="onLogout()">{{ 'NAVBAR.LOGOUT' | translate }}</button>
        <button *ngIf="user && user.role === 'author'" mat-button class="custom-button" [routerLink]="['author']">{{ 'NAVBAR.MANAGE_TOURS' | translate }}</button>
        <button *ngIf="user && user.role === 'author'" mat-button class="custom-button" [routerLink]="['author-object']">{{ 'NAVBAR.MANAGE_OBJECTS' | translate }}</button>
        <button *ngIf="user && user.role === 'administrator'" mat-button class="custom-button" [routerLink]="['equipment']">{{ 'NAVBAR.MANAGE_EQUIPMENT' | translate }}</button>
        <button *ngIf="user && user.role === 'administrator'" mat-button class="custom-button" [routerLink]="['accounts']">{{ 'NAVBAR.MANAGE_ACCOUNTS' | translate }}</button>
        <button *ngIf="user && user.role === 'administrator'" mat-button class="custom-button" [routerLink]="['app-rating']">{{ 'NAVBAR.RATINGS' | translate }}</button>
        <button *ngIf="user && user.role === 'tourist'" mat-button class="custom-button" [routerLink]="['app-rating']">{{ 'NAVBAR.RATE_US' | translate }}</button>
        <button *ngIf="user && user.role === 'administrator'" mat-button class="custom-button" [routerLink]="['encounter']">Create encounter</button>
        <button *ngIf="user && user.role === 'tourist'" mat-button class="custom-button" [routerLink]="['tourist-profile']">See Profile</button>
        <button *ngIf="user && user.role === 'tourist'" mat-button class="custom-button" [routerLink]="['addproblem']">Add Problem</button>
        <button mat-button class="custom-button" [routerLink]="['blog']">{{ 'NAVBAR.BLOGS' | translate }}</button>
        <button *ngIf="user" mat-button class="custom-button" [routerLink]="['editUserAccount']">{{ 'NAVBAR.EDIT_ACCOUNT' | translate }}</button>
        <button *ngIf="user && user.role === 'tourist'" mat-button class="custom-button" [routerLink]="['my-equipment']">{{ 'NAVBAR.MY_EQUIPMENT' | translate }}</button>
        <button *ngIf="user && user.role === 'tourist'" mat-button class="custom-button" [routerLink]="['location-simulator']">{{ 'NAVBAR.LOCATION_SIMULATOR' | translate }}</button>
        <button *ngIf="user && user.role === 'tourist'" mat-button class="custom-button" [routerLink]="['allclubs']">{{ 'NAVBAR.CLUB' | translate }}</button>
        <button *ngIf="user && user.role === 'tourist'" mat-button class="custom-button" [routerLink]="['start-tour']">{{ 'NAVBAR.START_TOUR' | translate }}</button>
        <button *ngIf="user && user.role === 'tourist'" mat-button class="custom-button" [routerLink]="['mytours']">{{ 'NAVBAR.MY_TOURS' | translate }}</button>
        <button *ngIf="user && user.role === 'tourist'" mat-button class="custom-button" [routerLink]="['followers']">{{ 'NAVBAR.FOLLOWERS' | translate }}</button>
        <button *ngIf="user && user.role === 'tourist'" mat-button class="custom-button" [routerLink]="['market']">{{ 'NAVBAR.TOURS_MARKET' | translate }}</button>
        <button *ngIf="user && (user.role === 'author' || user.role === 'tourist' || user.role === 'administrator')" mat-button class="custom-button" [routerLink]="['tour-problems']">{{ 'NAVBAR.TOUR_PROBLEMS' | translate }}</button>
        <button  mat-button class="custom-button" [routerLink]="['home-page']">HomePage</button>
        <button *ngIf="user && user.role === 'author'" mat-button class="custom-button" [routerLink]="['sales']">Sales</button>
        <button *ngIf="user && user.role === 'author'" mat-button class="custom-button" [routerLink]="['coupon']">Coupon</button>
        <button  mat-button class="custom-button" [routerLink]="['game-menu']">Game</button>
        <button *ngIf="user && user.role === 'author'" mat-button class="custom-button" [routerLink]="['bundle']">Bundle</button>

        <button *ngIf="user && user.role === 'tourist'" mat-button class="custom-button" [routerLink]="['paceges-publ']">Pacages</button>

        <button *ngIf="user && user.role ==='tourist'" mat-button class="custom-button" [routerLink]="['available-coupons']">Coupons</button>

        <div class="navbar-spacer"></div>

    </div>
    
</mat-toolbar>
