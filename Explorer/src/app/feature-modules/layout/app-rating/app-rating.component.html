<div id="rating" *ngIf="user && user.role === 'administrator'">
<p>Ratings</p>
<div id="ratings-details">
    <div>
        <table>
            <thead>
                <tr>
                    <th>Ocena</th>
                    <th>Komentar</th>
                    <th></th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let ar of appRatings">
                    <td>{{ar.rating}}</td>
                    <td>{{ar.comment}}</td>
                </tr>                
            </tbody>
        </table>
    </div>    
    </div>
</div>
<div *ngIf="user && user.role === 'tourist'">
    <form [formGroup]="ratingForm">
        <div>
            <mat-form-field>
                <mat-label>Rating</mat-label>
                <input matInput formControlName="rating" type="number"/>
            </mat-form-field>
            <mat-form-field>
              <mat-label>Comment</mat-label>
              <textarea matInput
              cdkTextareaAutosize
              cdkAutosizeMinRows="1"
              formControlName="comment"
              cdkAutosizeMaxRows="5"></textarea>
            </mat-form-field>
        <button color="primary" type="submit" (click)="addRating()" [disabled]="ratingForm.invalid" mat-raised-button>Done</button>
        </div>
    </form> 
</div>
