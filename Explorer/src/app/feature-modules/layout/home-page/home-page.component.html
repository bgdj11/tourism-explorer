<div class="home-container">
    <div class="slogan-container">
        <h1 class="slogan">Do More with Explorer</h1>
        <div class="input-button-group">
            <input 
                type="text" 
                placeholder="Where would you like to go?" 
                class="destination-input"
            />
            <button mat-raised-button class="discover-btn" [routerLink]="['/tour-preferences']">Discover</button>
        </div>
    </div>
</div>

<div>
    <mat-icon>plane</mat-icon>
    <h1>Explore with us</h1>
</div>
<div class="tours">
    <xp-tours-view></xp-tours-view>
</div>

<div>
    <mat-icon>plane</mat-icon>
    <h1>From the blog</h1>
</div>
<div class="blog">
    <img src="assets/blog.jpeg" alt="Blog Image" class="blog-image" />
    <div class="green-background">
        <p class="blog-text">
            <span class="highlight">SHARE</span> your travel adventures and inspire others! Leave a <span class="highlight">COMMENT</span>, blog about your favorite destinations, or <span class="highlight">EXPLORE</span> the stories and experiences of other travelers. 
        </p>
        <p class="blog-text">
            Your story could spark someone's next unforgettable journey!
        </p>
        <button class="blog-button" [routerLink]="['/blog']">Post</button>
    </div>
</div>
