<div id="blog">
    <p>Blog</p>
    <hr>
    <div id="blog-details">
        <div>
            <table>
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Description</th>
                        <th>Created Date</th>
                        <th>Images</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let blog of blogs">
                        <td>{{blog.title}}</td>
                        <td>{{blog.description}}</td>
                        <td>{{blog.createdDate}}</td>
                        <td>{{blog.images}}</td>
                        <td>{{blog.status}}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
   
    
</div>
