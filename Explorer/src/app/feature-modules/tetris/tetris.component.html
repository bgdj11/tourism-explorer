<div class="container">
  <!-- Main game board -->
  <div class="tetris-wrapper">
    <canvas #board class="game-board"></canvas>
  </div>

  <!-- Right column for stats -->
  <aside class="right-column">
    <h1 class="title">TETRIS</h1>

    <div class="stats">
      <div class="stat">
        <span class="label">Score</span>
        <span class="value">{{ points }}</span>
      </div>
      <div class="stat">
        <span class="label">Lines</span>
        <span class="value">{{ lines }}</span>
      </div>
      <div class="stat">
        <span class="label">Level</span>
        <span class="value">{{ level }}</span>
      </div>
    </div>

    <div class="next-wrap">
      <div class="next-title">Next</div>
      <canvas #next class="next"></canvas>
    </div>

    <button *ngIf="!gameOverFlag" (click)="resetGame()" class="play-button">
      Play
    </button>
  </aside>
</div>

<!-- GAME OVER pop-up -->
<div class="overlay" *ngIf="gameOverFlag">
  <div class="popup">
    <h2>GAME OVER</h2>
    <p>Your Score: {{ finalScore }}</p>
    <p>Lines Cleared: {{ finalLines }}</p>
    <div class="popup-buttons">
      <button (click)="resetGame()" class="play-button">Play Again</button>
      <button (click)="exitGame()" class="close-button">Close</button>
    </div>
  </div>
</div>
