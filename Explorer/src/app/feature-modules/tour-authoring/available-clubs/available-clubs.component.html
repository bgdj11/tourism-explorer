<div *ngFor="let club of clubs" class="club-card">
    <h4>{{ club.name }}</h4>
    <p>{{ club.description }}</p>
    <img [src]="club.photo" alt="{{ club.name }}" width="100" height="100">
    
    <!-- Prikaz za turiste koji su već članovi -->
    <div *ngIf="hasJoinedTheClub(club.id)">
      <p>You are a member of this club!</p>
    </div>
    
    <!-- Prikaz za turiste koji imaju poziv -->
    <div *ngIf="hasInvitationForClub(club.id)">
      <p>You have been invited to join this club!</p>
      <button (click)="acceptInvitation(club.id)">Accept Invitation</button>
      <button (click)="rejectInvitation(club.id)">Reject Invitation</button>
    </div>
    
    <!-- Prikaz za turiste bez poziva i koji nisu članovi -->
    <div *ngIf="!hasInvitationForClub(club.id) && !hasJoinedTheClub(club.id)">
      <button *ngIf="club.id && !hasRequestSent(club.id)" (click)="sendJoinRequest(club.id)">Send Request</button>
      <button *ngIf="club.id && hasRequestSent(club.id)" (click)="withdrawMembershipRequest(club.id)">Withdraw Request</button>
    </div>
  </div>
