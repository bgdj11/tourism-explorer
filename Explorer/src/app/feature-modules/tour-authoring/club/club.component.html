<div id="clubs">
  <!-- Header sa dugmetom za dodavanje kluba -->
  <div id="clubs-header" style="display: flex; justify-content: space-between; align-items: center;">
    <button (click)="toggleAddClubForm()">+ Add Club</button>
  </div>
  <hr>

  <!-- Forma za dodavanje novog kluba -->
  <div *ngIf="showAddClubForm" class="form-section">
    <h3>Add New Club</h3>
    <form class="form" (submit)="addClub()">
      <label>
        Name:
        <br>
        <input [(ngModel)]="newClub.name" name="name">
      </label>
      <br>
      <label>
        Description:
        <br>
        <input [(ngModel)]="newClub.description" name="description">
      </label>
      <br>
      <label>
        Photo URL:
        <br>
        <input [(ngModel)]="newClub.photo" name="photo">
      </label>
      <br>
      <button type="submit">Add Club</button>
      <button type="button" (click)="toggleAddClubForm()">Cancel</button>

    </form>
  </div>

  <hr>
  <!-- Lista klubova -->
  <div id="clubs-list">
    <div *ngFor="let cl of clubs" class="club-container">

      <!-- Slika kluba sa desne strane -->
      <div class="club-image">
        <img [src]="cl.photo" alt="{{ cl.name }}">
      </div>

      <!-- Informacije o klubu sa leve strane -->
      <div class="club-info">
        <h4>{{ cl.name }}</h4>
        <p>{{ cl.description }}</p>
        <div class="club-actions">
          <button *ngIf="cl.ownerId === currentUserId && cl.id !== undefined" (click)="deleteClub(cl.id!)">Delete</button>
          <button *ngIf="cl.ownerId === currentUserId" (click)="editClub(cl)">Edit</button>
          <button *ngIf="cl.ownerId === currentUserId && cl.id !== undefined" (click)="toggleTouristList(cl.id!)">Add Tourist</button>
        </div>
      </div>

      <!-- Lista turista koja se prikazuje ispod slika i informacija o klubu -->
      <div *ngIf="showTouristListForClubId === cl?.id" class="tourist-list-container">
        <div class="form-section">
          <h4>Tourist List</h4>
          <table>
            <thead>
              <tr>
                <th>Username</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let tourist of filteredTourists">
                <td>{{ tourist.username }}</td>
                <td>
                  <button 
                    *ngIf="isTouristInClub(tourist.id, cl.id || 0)" 
                    (click)="removeTouristFromClub(tourist.id, cl.id || 0)">
                    Remove
                  </button>
                  <button 
                    *ngIf="!isTouristPendingOrAcceptedOrRejected(tourist.id, cl.id || 0)" 
                    (click)="inviteTourist(tourist, cl.id || 0)" 
                    [disabled]="cl.id && touristInvitedForClub[cl.id]?.[tourist.id]">
                    Invite
                  </button>
                  <div *ngIf="isTouristWaitingAcception(tourist.id, cl.id || 0)">
                    <button 
                      (click)="acceptTouristRequest(tourist.id, cl.id || 0)">
                      Accept the request
                    </button>
                    <button
                      (click)="rejectTouristRequest(tourist.id, cl.id || 0)">
                      Reject the request
                    </button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <hr>

  <!-- Forma za uređivanje kluba -->
  <div *ngIf="editingClub" class="form-section">
    <h3>Edit Club</h3>
    <form class="form" (submit)="updateClub()">
      <label>
        Name:
        <br>
        <input [(ngModel)]="editingClub.name" name="name">
      </label>
      <br>
      <label>
        Description:
        <br>
        <input [(ngModel)]="editingClub.description" name="description">
      </label>
      <br>
      <label>
        Photo URL:
        <br>
        <input [(ngModel)]="editingClub.photo" name="photo">
      </label>
      <br>
      <button type="submit">Update</button>
      <button type="button" (click)="editingClub = null">Cancel</button>
    </form>
  </div>
  <div id="available-clubs">
    <h3>Available Clubs to Join </h3>
    <xp-available-clubs [clubs]="availableClubs"></xp-available-clubs>
  </div>
</div>
