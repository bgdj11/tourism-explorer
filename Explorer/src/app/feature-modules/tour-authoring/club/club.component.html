<div id="clubs">
  <p>Clubs</p>
  <hr>
  <div id="clubs-details">
    <div>
      <table>
          <thead>
              <tr>
                  <th>Name</th>
                  <th>Description</th>
                  <th>Photo</th>
                  <th>Actions</th>
              </tr>
          </thead>
          <tbody>
              <tr *ngFor="let cl of clubs">
                  <td>{{cl.name}}</td>
                  <td>{{cl.description}}</td>
                  <td>{{cl.photo}}</td>
                  <td>
                      <button (click)="cl.id !== undefined ? deleteClub(cl.id) : null">Delete</button>
                      <button *ngIf="cl.ownerId === currentUserId" (click)="editClub(cl)">Edit</button>
                  </td>
              </tr>
          </tbody>
      </table>
    </div>
  </div>
  <hr>
  <div *ngIf="editingClub"  class="form-section">
      <h3>Edit Club</h3>
      <form class="form" (submit)="updateClub()">
        <label>
          Name:
          <input [(ngModel)]="editingClub.name" name="name">
        </label>
        <br>
        <label>
          Description:
          <input [(ngModel)]="editingClub.description" name="description">
        </label>
        <br>
        <label>
          Photo URL:
          <input [(ngModel)]="editingClub.photo" name="photo">
        </label>
        <br>
        <button type="submit">Update Club</button>
      </form>
    </div>

  <hr>
  <div class="form-section">
    <h3>Add New Club</h3>
    <form class="form" (submit)="addClub()">
      <label>
        Name:
        <input [(ngModel)]="newClub.name" name="name">
      </label>
      <br>
      <label>
        Description:
        <input [(ngModel)]="newClub.description" name="description">
      </label>
      <br>
      <label>
        Photo URL:
        <input [(ngModel)]="newClub.photo" name="photo">
      </label>
      <br>
      <button type="submit">Add Club</button>
    </form>

  </div>
</div>
