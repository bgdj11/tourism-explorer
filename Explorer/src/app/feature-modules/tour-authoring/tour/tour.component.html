<div class="container">
  <h2>Ture</h2>

  <!-- Dugme za dodavanje nove ture -->
  <div class="d-flex justify-content-end mb-3">
    <button class="btn btn-primary" (click)="openModal('add')">Dodaj novu turu</button>
  </div>

  <!-- Tabela tura -->
  <table class="table table-striped">
    <thead>
    <tr>
      <th>#</th>
      <th>Naziv</th>
      <th>Opis</th>
      <th>Težina</th>
      <th>Cena</th>
      <th>Akcije</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let tour of tours; let i = index">
      <td>{{ (currentPage - 1) * pageSize + i + 1 }}</td>
      <td>{{ tour.name }}</td>
      <td>{{ tour.description }}</td>
      <td>{{ tour.weight }}</td>
      <td>{{ tour.price | currency }}</td>
      <td>
        <button class="btn btn-warning btn-sm" (click)="openModal('edit', tour)">Edituj</button>
        <button class="btn btn-danger btn-sm" (click)="deleteTour(tour.id)">Obriši</button>
      </td>
    </tr>
    </tbody>
  </table>

  <!-- Paginacija -->
  <div class="pagination-controls">
    <button class="btn btn-secondary" (click)="previousPage()" [disabled]="currentPage === 1">Prethodna</button>
    <button class="btn btn-secondary" (click)="nextPage()" [disabled]="(currentPage * pageSize) >= totalCount">Sledeća</button>
  </div>
</div>
<!-- Modal za dodavanje/editovanje ture -->
<div class="modal fade" id="tourModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">{{ modalTitle }}</h5>
        <button type="button" class="close" (click)="closeModal()" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <!-- Forma za dodavanje/editovanje ture -->
        <form (ngSubmit)="onSubmit()">
          <div class="form-group">
            <label for="name">Naziv Ture</label>
            <input type="text" class="form-control" id="name" [(ngModel)]="tour.name" name="name" required />
          </div>
          <div class="form-group">
            <label for="description">Opis Ture</label>
            <textarea class="form-control" id="description" [(ngModel)]="tour.description" name="description" required></textarea>
          </div>
          <div class="form-group">
            <label for="weight">Težina</label>
            <input type="text" class="form-control" id="weight" [(ngModel)]="tour.weight" name="weight" />
          </div>
          <div class="form-group">
            <label for="price">Cena</label>
            <input type="number" class="form-control" id="price" [(ngModel)]="tour.price" name="price" />
          </div>
          <div class="form-group">
            <label for="tags">Tagovi</label>
            <input type="text" class="form-control" id="tags" [(ngModel)]="tour.tags" name="tags" />
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" (click)="closeModal()">Zatvori</button>
            <button type="submit" class="btn btn-primary">Sačuvaj</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
